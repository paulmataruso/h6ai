# h6ai development and test environment, layered over compose.yaml:
#
#   docker compose -f compose.yaml -f compose.dev.yaml up -d --build
#   (or COMPOSE_FILE=compose.yaml:compose.dev.yaml in .env, then plain `docker compose ...`)
#
#   browse:      http://172.16.1.67:8687/
#   info/admin:  http://172.16.1.67:8687/_h6ai/public/   (user "admin", password "admin-test")
#   web root:    ./webroot with the sample tree, including big/big-7g.bin
#
# The integration and browser tests (npm run test:integration / test:e2e) expect this setup.

services:
  h6ai:
    image: h6ai:dev
    ports: !override
      - "${H6AI_BIND:-172.16.1.67}:${H6AI_PORT:-8687}:80"
    environment:
      # Bootstrap admin instead of a created one: user "admin", password_hash('admin-test'),
      # works while no admin user exists. "$" is escaped as "$$" for compose.
      H6AI_PASSHASH: "$$2y$$10$$3oSPC0TARrMhHAVbLgW5O.IDVLaWCC4eOwApT63oHr.wQ3BCanofi"
      # Seed the sample tree into an empty web root on first start (H6AI_RESEED=1 re-creates it).
      H6AI_SEED: "1"
      # Size of the random performance test file big/big-<N>g.bin in GiB (0 to disable).
      H6AI_SEED_BIG_GB: "${H6AI_SEED_BIG_GB:-7}"
      # re-check PHP files every 2 s, so edits to a mounted build show up
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "1"
      PHP_OPCACHE_REVALIDATE_FREQ: "2"
    volumes:
      - ./webroot:/srv/www
      # options the tests rely on (search, tree, ...), deep-merged over options.json
      - ./docker/options.local.json:/srv/www/_h6ai/private/conf/options.local.json:ro
    # php-fpm's slowlog (request_slowlog_timeout=10s) needs ptrace to dump stack traces.
    # cap_add: [SYS_PTRACE]
