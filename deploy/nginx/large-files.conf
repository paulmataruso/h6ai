# h6ai: large-file tuning, server {} level (so it never clashes with the distribution's http {}
# defaults). nginx serves every file byte; PHP only answers the auth_request gate.

sendfile on;
tcp_nopush on;
tcp_nodelay on;
# reads that would block a worker go to a thread pool; files >= 16 MiB bypass the page cache
aio threads;
directio 16m;
output_buffers 2 1m;

open_file_cache max=10000 inactive=60s;
open_file_cache_valid 60s;
open_file_cache_min_uses 1;
open_file_cache_errors on;

keepalive_timeout 65s;
send_timeout 300s;

# compression: text only, never media or archives
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml text/markdown text/javascript
           application/javascript application/json application/xml image/svg+xml;
