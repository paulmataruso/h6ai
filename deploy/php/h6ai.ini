; h6ai PHP settings, the single source for both install types:
;
; * Docker: installed as conf.d/zz-h6ai.ini. Values written as ${VAR:-default} can be overridden
;   through the container environment (PHP >= 8.3 ini interpolation).
; * Native (install.sh): the opcache.* and realpath_cache_* lines go into the PHP-FPM conf.d
;   (they are process wide), every other line becomes a php_admin_value of the dedicated h6ai
;   pool, so other PHP sites on the host keep their settings. ${VAR:-default} means default there.
;   error_log and session.save_path are set per install type.

; --- errors / disclosure ---
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
error_reporting = E_ALL
expose_php = Off
date.timezone = UTC

; --- long streaming downloads (archives, gated files) ---
output_buffering = Off
zlib.output_compression = Off
implicit_flush = Off
max_execution_time = 0
memory_limit = ${PHP_MEMORY_LIMIT:-256M}

; --- request input (CVE-2026-109618 risk reduction) ---
; The fix is PHP >= 8.3.36 (enforced at image build). These limits shrink the attack surface
; of the out-of-memory trigger paths named in GHSA-w8hw-w9fx-j79w: h6ai never accepts uploads
; or multipart bodies (nginx answers 415) and only posts small JSON / urlencoded forms.
; h6ai parses its JSON and form posts itself: PHP's body parsers, multipart included, never run
enable_post_data_reading = Off
file_uploads = Off
max_file_uploads = 0
upload_max_filesize = 1K
post_max_size = 1M
max_multipart_body_parts = 1
max_input_vars = 5000
max_input_nesting_level = 8
; don't use RLIMIT_AS / RLIMIT_DATA style limits: they make mmap() fail, which is exactly the
; condition the advisory warns about. memory_limit stays finite (patched PHP handles OOM safely).

; --- filesystem ---
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; --- sessions (h6ai also hardens cookie params at runtime) ---
session.save_handler = files
session.save_path = /var/lib/php/sessions
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
session.gc_maxlifetime = 28800

; --- OPcache / JIT ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
; set PHP_OPCACHE_VALIDATE_TIMESTAMPS=0 in production (immutable image) for maximum speed
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.revalidate_freq = ${PHP_OPCACHE_REVALIDATE_FREQ:-2}
opcache.save_comments = 0
opcache.jit = tracing
opcache.jit_buffer_size = 32M
