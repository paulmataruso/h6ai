# test-native/dropin-custom.sh: a drop-in on a server block that grew up around h5ai, the way the
# drop-in guide's "Coming from h5ai" section converts it. TLS (a self-signed stand-in at the Let's
# Encrypt paths), HTTP/2, HTTP/3 with 0-RTT, several logs, rate limits, custom error pages, a
# caching rule for static files and, as markers for the test's variants:
#   @basic     commented out unless the variant turns basic auth on
#   @internal  the recommended internal location (removed by one variant)
#   @php-check the PHP location's "not found" check (removed by one variant)
# The http-level parts (log formats, maps, zones) and the thread pool come from the test script.

server {
    index index.php;
    server_name files.example.com;
    disable_symlinks off;

    # only _h6ai in here; the files live in /srv/files (h6ai's files folder)
    root /var/www/html;
    error_page 403 404 = /_h6ai/public/index.php;
    log_not_found off;

    access_log /var/log/nginx/files.access.log main;
    error_log /var/log/nginx/files.error.log warn;
    access_log /var/log/nginx/files.download.log download if=$log_download;
    access_log /var/log/nginx/goaccess.log goaccess;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    #auth_basic "Ask the webmaster for a login"; # @basic
    #auth_basic_user_file /etc/nginx/.htpasswd; # @basic

    error_page 401 /401.html;
    location = /401.html {
        auth_basic off;
        root /var/www/errors;
        internal;
    }
    error_page 429 /429.html;
    location = /429.html {
        auth_basic off;
        root /var/www/errors;
        internal;
    }
    error_page 503 /503.html;
    location = /503.html {
        auth_basic off;
        root /var/www/errors;
        internal;
    }

    # a caching rule for static files: now only h6ai's own files and thumbnails match
    location ~* \.(?:jpg|jpeg|png|gif|ico|css|js|svg|woff2?|ttf|eot|mp4|mkv|webm|zip|tar|gz|bz2)$ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        add_header Alt-Svc 'h3=":443"; ma=86400';
        try_files $uri =404;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+?\.php)(/.*)$;
        limit_conn conn_limit 20;
        if (!-f $document_root$fastcgi_script_name) { # @php-check
            return 404; # @php-check
        } # @php-check
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # h6ai answers 425 to API requests sent as TLS early data
        fastcgi_param HTTP_EARLY_DATA $ssl_early_data;

        client_max_body_size 1m;
        fastcgi_read_timeout 600s;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 16 256k;
        fastcgi_busy_buffers_size 512k;
        add_header Alt-Svc 'h3=":443"; ma=86400' always;
    }

    location ^~ /_h6ai/private/ { # @internal
        internal; # @internal
        limit_req zone=download_limit burst=120 nodelay; # @internal
        aio threads=files_pool; # @internal
    } # @internal

    listen 443 ssl;
    listen 443 quic reuseport;
    http2 on;
    http3 on;
    quic_retry on;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;

    ssl_certificate /etc/letsencrypt/live/files.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/files.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_early_data on;
}

server {
    listen 80;
    server_name files.example.com;
    return 301 https://$host$request_uri;
}
