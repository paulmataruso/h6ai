name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run release
      - uses: actions/upload-artifact@v4
        with:
          name: h6ai-build
          path: build/h6ai-*.tar.gz

  php:
    name: PHP lint (8.2, 8.3, 8.4)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find src -name '*.php' -print0 | xargs -0 -n1 php -l

  integration:
    name: Docker + integration tests
    runs-on: ubuntu-latest
    needs: [check, php]
    env:
      H6AI_BIND: 127.0.0.1
      H6AI_PORT: 8687
      H6AI_SEED_BIG_GB: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: docker compose up -d --build --wait
      - run: sh test-integration/run.sh
      - if: failure()
        run: docker compose logs --tail=200
      - if: always()
        run: docker compose down -v
