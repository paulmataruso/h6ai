; h6ai: PHP settings for its entry point. PHP-FPM reads them from this folder (user_ini.filename),
; so they apply on drop-in installs too, where php.ini is the server's own. h6ai's installer and
; Docker image set the same in their PHP-FPM pool (deploy/php/h6ai.ini).

; PHP doesn't parse request bodies: h6ai reads its JSON and form posts itself, so PHP's multipart
; parser (the CVE-2026-109618 trigger) never runs, with or without nginx rules in front.
enable_post_data_reading = Off
post_max_size = 1M
max_input_vars = 5000
max_input_nesting_level = 8

; long streamed downloads
output_buffering = Off
zlib.output_compression = Off
max_execution_time = 0

session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Strict
