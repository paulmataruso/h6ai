# h6ai container: the public server and a loopback-only status server.
# The h6ai parts are shared with the native installer and live in deploy/nginx/
# (installed as /etc/nginx/h6ai/*).

include h6ai/http.conf;

upstream h6ai_php {
    server 127.0.0.1:9000;
}

server {
    listen 80 default_server;
    server_name _;
    root /srv/www;

    include h6ai/large-files.conf;
    include h6ai/server.conf;
}

# php-fpm status and ping, reachable from inside the container only (healthcheck).
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;

    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param SCRIPT_FILENAME $uri;
        fastcgi_pass h6ai_php;
    }

    location / {
        return 404;
    }
}
