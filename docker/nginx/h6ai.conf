# h6ai: public server. Every file under the web root is authorised by PHP (auth_request),
# directories are rendered by h6ai, and only /_h6ai/public/index.php is ever executed.

# --- CVE-2026-10961 (and same-origin script in shared files) -----------------------------------
# User supplied "active" documents (HTML, SVG, XML, MHTML) are served with a CSP sandbox: no
# script, no forms, opaque origin. A crafted page in the share can't run code in a visitor's
# browser from our origin (renderer exploit chains need script). Trusted prefixes can opt out,
# e.g. a static site you host in the share:
#     ~^/my-trusted-site/   1;
map $uri $h6ai_trusted_html {
    default 0;
}
map $h6ai_trusted_html $h6ai_active_csp {
    default "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:";
    1       "";
}

server {
    listen 80 default_server;
    server_name _;

    root /srv/www;
    charset utf-8;
    # relative Location headers: the container port differs from the published one
    absolute_redirect off;

    # --- CVE-2026-109618 (PHP OOM RCE): h6ai never needs multipart bodies or exotic methods.
    # Reject them before anything reaches PHP (the main trigger of the bug is multipart parsing).
    if ($request_method !~ ^(GET|HEAD|POST)$) {
        return 405;
    }
    if ($content_type ~* "^\s*multipart/") {
        return 415;
    }

    location / {
        # Inside the auth subrequest $uri is "/_h6ai_auth", so capture the decoded, normalised
        # URI here. Re-evaluated after internal redirects (e.g. /site/ -> /site/index.html).
        set $h6ai_gate_uri $uri;
        auth_request /_h6ai_auth;
        auth_request_set $h6ai_cc $upstream_http_x_h6ai_cache_control;
        add_header Cache-Control $h6ai_cc always;
        add_header X-Content-Type-Options nosniff always;

        # Serve a folder's own index file if it has one, otherwise h6ai.
        index index.html index.htm /_h6ai/public/index.php;
        try_files $uri $uri/ =404;

        # Active documents: same gate, plus the sandbox CSP. add_header and rewrite-module
        # directives (set) of the outer location don't apply here, so they are repeated.
        location ~* \.(?:html?|xhtml|shtml|svgz?|xml|xslt?|mht|mhtml)$ {
            set $h6ai_gate_uri $uri;
            auth_request /_h6ai_auth;
            auth_request_set $h6ai_cc $upstream_http_x_h6ai_cache_control;
            add_header Cache-Control $h6ai_cc always;
            add_header X-Content-Type-Options nosniff always;
            add_header Content-Security-Policy $h6ai_active_csp always;
            try_files $uri =404;
        }
    }

    # File gate: PHP answers 204 (allowed), 401 (guest denied) or 403 (user denied).
    # Only explicit params are sent so nothing from the client can override them; request
    # headers (Cookie, Range, User-Agent, Sec-Fetch-*) still arrive as HTTP_* variables.
    location = /_h6ai_auth {
        internal;
        fastcgi_pass_request_body off;
        fastcgi_intercept_errors off;

        fastcgi_param GATEWAY_INTERFACE CGI/1.1;
        fastcgi_param SERVER_SOFTWARE   nginx/$nginx_version;
        fastcgi_param SERVER_PROTOCOL   $server_protocol;
        fastcgi_param SERVER_NAME       $server_name;
        fastcgi_param SERVER_ADDR       $server_addr;
        fastcgi_param SERVER_PORT       $server_port;
        fastcgi_param REMOTE_ADDR       $remote_addr;
        fastcgi_param REMOTE_PORT       $remote_port;
        fastcgi_param REQUEST_SCHEME    $scheme;
        fastcgi_param HTTPS             $https if_not_empty;
        fastcgi_param DOCUMENT_ROOT     $document_root;
        fastcgi_param SCRIPT_FILENAME   /srv/www/_h6ai/public/index.php;
        fastcgi_param SCRIPT_NAME       /_h6ai/public/index.php;
        fastcgi_param REQUEST_METHOD    GET;
        fastcgi_param REQUEST_URI       $request_uri;
        fastcgi_param H6AI_GATE_URI     $h6ai_gate_uri;
        # the client's method (subrequests are GET); PHP doesn't log HEAD requests
        fastcgi_param H6AI_GATE_METHOD  $request_method;
        fastcgi_param QUERY_STRING      "";
        fastcgi_param CONTENT_TYPE      "";
        fastcgi_param CONTENT_LENGTH    "";
        fastcgi_param REDIRECT_STATUS   200;
        fastcgi_param H6AI_GATE         check;

        fastcgi_read_timeout 30s;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Search engines: a real robots.txt / sitemap.xml in the web root wins, otherwise h6ai
    # generates them (REQUEST_URI stays /robots.txt resp. /sitemap.xml). Not gated.
    location = /robots.txt {
        try_files $uri /_h6ai/public/index.php$is_args$args;
    }
    location = /sitemap.xml {
        try_files $uri /_h6ai/public/index.php$is_args$args;
    }

    # The h6ai entry point: pages, JSON API and archive downloads.
    location = /_h6ai/public/index.php {
        # h6ai only posts application/json and x-www-form-urlencoded, tiny bodies
        client_max_body_size 1m;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param SCRIPT_NAME $fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param H6AI_GATE "";

        # Streamed archives send "X-Accel-Buffering: no": nginx then relays the stream through a
        # single fastcgi_buffer_size buffer. The 4k default caps archives at ~20 MiB/s; 256k gives
        # ~6x that (see docs/PERFORMANCE.md).
        fastcgi_buffering on;
        fastcgi_buffer_size 256k;
        fastcgi_buffers 16 256k;
        fastcgi_busy_buffers_size 512k;
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_pass 127.0.0.1:9000;
    }

    # Static h6ai assets (URLs are versioned) and thumbnails (unguessable names, ?v=mtime).
    location ^~ /_h6ai/public/ {
        # /_h6ai/public/ is the info/admin page
        index index.php;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # PHP sources, config, user database, private cache.
    location ^~ /_h6ai/private/ {
        deny all;
    }

    # Anything else below /_h6ai/ (README, CHANGELOG, ...) is not public either.
    location ^~ /_h6ai/ {
        deny all;
    }
}

# php-fpm status and ping, reachable from inside the container only (healthcheck).
server {
    listen 127.0.0.1:8081;
    server_name localhost;
    access_log off;

    location ~ ^/(fpm-status|fpm-ping)$ {
        allow 127.0.0.1;
        deny all;
        include fastcgi_params;
        fastcgi_param SCRIPT_NAME $uri;
        fastcgi_param SCRIPT_FILENAME $uri;
        fastcgi_pass 127.0.0.1:9000;
    }

    location / {
        return 404;
    }
}
