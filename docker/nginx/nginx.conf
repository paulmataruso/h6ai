# h6ai: nginx main configuration, tuned for serving large files.

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pcre_jit on;
error_log /dev/stderr warn;

include /etc/nginx/modules/*.conf;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                    'rt=$request_time';
    access_log /dev/stdout main;

    # --- large files ---------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    aio threads;
    directio 16m;
    output_buffers 2 1m;

    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 1;
    open_file_cache_errors on;

    keepalive_timeout 65s;
    send_timeout 300s;
    # no uploads - API requests are small JSON / form posts
    client_max_body_size 1m;

    # --- compression: text only, never media or archives -----------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/markdown text/javascript
               application/javascript application/json application/xml image/svg+xml;

    include /etc/nginx/http.d/*.conf;
}
