; h6ai php-fpm pool. Installed as php-fpm.d/zz-h6ai.conf so it overrides the image defaults
; (docker.conf listens on 0.0.0.0:9000 - we only listen on loopback).

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 32
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 1000

; downloads of large files/archives can take hours
request_terminate_timeout = 0
request_slowlog_timeout = 10s
slowlog = /proc/self/fd/2

; nginx already writes an access log
access.log = /dev/null
catch_workers_output = yes
decorate_workers_output = no

; keep the container environment (H6AI_PASSHASH) visible to PHP via getenv()
clear_env = no

; only reachable through the loopback-only nginx server (see docker/nginx/h6ai.conf)
pm.status_path = /fpm-status
ping.path = /fpm-ping
ping.response = pong
