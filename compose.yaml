# h6ai with Docker: nginx + PHP-FPM in one container.
#
#   cp .env.example .env        # set H6AI_FILES, H6AI_BIND, H6AI_PORT
#   docker compose up -d --build
#   docker compose logs h6ai | grep -A2 "first admin"     # the generated admin password
#
# Upgrade: git pull (or unpack a new release) and run `docker compose up -d --build` again.
# Users, permissions and settings live in the h6ai-data volume; your files are never modified.
# Development and tests add compose.dev.yaml (sample tree, bootstrap login). See docs/INSTALL.md.

services:
  h6ai:
    build:
      context: .
      target: runtime
      args:
        # "prebuilt" uses the _h6ai folder of a release bundle instead of compiling the sources
        H6AI_SOURCE: "${H6AI_SOURCE:-build}"
    image: h6ai:latest
    ports:
      - "${H6AI_BIND:-0.0.0.0}:${H6AI_PORT:-8080}:80"
    environment:
      # First admin, created on the first start while no admin exists. Without a password, one is
      # generated and printed to the log once. H6AI_ADMIN_PASSWORD_FILE works with Docker secrets.
      H6AI_ADMIN_USER: "${H6AI_ADMIN_USER:-admin}"
      H6AI_ADMIN_PASSWORD: "${H6AI_ADMIN_PASSWORD:-}"
      # code only changes when the container starts, so PHP never has to re-check files
      PHP_OPCACHE_VALIDATE_TIMESTAMPS: "0"
      PHP_MEMORY_LIMIT: "${PHP_MEMORY_LIMIT:-256M}"
    volumes:
      # the folder to share; h6ai installs itself into <folder>/_h6ai (hidden in listings)
      - "${H6AI_FILES:-./files}:/srv/www"
      # users, roles, folder groups, permissions, settings, activity log
      - h6ai-data:/srv/www/_h6ai/private/data
    restart: unless-stopped

volumes:
  h6ai-data:
